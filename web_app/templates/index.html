<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Driver RS485 Controller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 2rem;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        #status-container {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }
        .running {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">LED Driver RS485 Controller</h1>
        
        <div id="port-loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading available ports...</p>
        </div>
        
        <div id="no-ports" class="alert alert-warning" style="display: none;">
            No USB serial ports found. Please connect your RS485 adapter and refresh the page.
        </div>
        
        <form id="countdown-form" style="display: none;">
            <div class="form-group">
                <label for="port-select">Select Port:</label>
                <select id="port-select" class="form-control">
                    <!-- Ports will be populated by JavaScript -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="seconds-input">Countdown Seconds:</label>
                <input type="number" id="seconds-input" class="form-control" min="1" max="99" value="10">
                <small class="form-text text-muted">Enter a value between 1 and 99 seconds.</small>
            </div>
            
            <div class="form-group">
                <label for="baudrate-input">Baudrate:</label>
                <select id="baudrate-input" class="form-control">
                    <option value="9600">9600</option>
                    <option value="19200">19200</option>
                    <option value="38400">38400</option>
                    <option value="57600">57600</option>
                    <option value="115200">115200</option>
                </select>
            </div>
            
            <button type="submit" id="start-button" class="btn btn-primary w-100">Start Countdown</button>
        </form>
        
        <div id="status-container">
            <p id="status-message"></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
